# Configuration Authelia 4.38 — portail d'authentification.
# Les SECRETS ne sont PAS ici : ils sont injectés par variables d'environnement
# (voir docker-compose.yml + deploy/.env). Les domaines sont ceux de l'instance :
# `sslip.io` résout n'importe quel nom contenant une IP vers cette IP, ce qui donne
# de vrais sous-domaines sans en posséder aucun — le temps que le DNS définitif suive.

theme: 'light'

server:
  address: 'tcp://:9091'

log:
  level: 'info'

# La méthode proposée D'ABORD au second facteur. Sans ce réglage, Authelia ouvre sur la
# clé de sécurité (WebAuthn) — constaté le 2026-09-06 sur le premier compte d'essai : la
# personne venait d'enrôler un TOTP, et l'écran lui répondait « Enregistrez votre premier
# appareil ». Le message est exact pour WebAuthn et parfaitement trompeur pour qui vient
# de terminer un enrôlement : il se lit comme « rien n'est enregistré », et un arrivant
# seul en conclut que son inscription a échoué.
#
# WebAuthn reste disponible — c'est un facteur plus fort, on ne le retire pas ; il cesse
# seulement d'être celui qu'on propose à quelqu'un qui n'en a pas.
default_2fa_method: 'totp'

# --- TOTP (application d'authentification 2FA : Google Authenticator, Aegis…) ---
totp:
  issuer: '{{ env "BD_DOMAINE" }}'

identity_validation:
  reset_password:
    # 5 minutes suffisaient quand le lien s'allait lire dans un fichier sur le serveur.
    # Par courriel, le délai de remise s'ajoute à celui de la personne qui relève sa
    # boîte : un lien expiré ressemble alors à une panne, et l'on recommence en boucle.
    jwt_lifespan: '15 minutes'
    # jwt_secret -> AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET

# --- Comptes : annuaire LLDAP, administrable à l'écran (AUTH-7) ---
# C'était un fichier local édité en SSH jusqu'au 2026-09-06. Ce n'était pas le temps
# de saisie qui posait problème, c'était qu'un geste d'administration exigeait un
# SHELL sur le VPS — donc n'était délégable à personne sans donner bien plus.
authentication_backend:
  password_reset:
    disable: false

  # --- Annuaire LLDAP (AUTH-7) ---
  #
  # `implementation: 'lldap'` pose lui-même les filtres et les attributs : ne PAS les
  # récrire à la main, un préréglage à moitié recopié est pire qu'absent.
  #
  # Le compte de service est dans **`lldap_password_manager`**, pas dans
  # `lldap_strict_readonly` : `password_reset.disable: false` ci-dessus veut dire
  # qu'Authelia doit pouvoir ÉCRIRE un mot de passe. Et jamais dans `lldap_admin` —
  # un service n'a pas à pouvoir créer ni supprimer des comptes.
  #
  # CONSÉQUENCE À CONNAÎTRE : LLDAP interdit à un `password_manager` de changer le mot
  # de passe d'un `lldap_admin` (anti-élévation de privilège). « Mot de passe oublié ? »
  # ne fonctionnera donc PAS pour les comptes qui administrent l'annuaire. Leur recours
  # est l'interface de LLDAP elle-même, et en dernier ressort `LLDAP_LDAP_USER_PASS`
  # dans `.env` — qui est aussi la seule façon de rentrer si l'on se verrouille dehors.
  #
  # Le mot de passe passe par le GABARIT et non par `AUTHELIA_AUTHENTICATION_BACKEND_*` :
  # une chose se configure à un endroit, règle payée le 2026-09-05 avec le notifier SMTP.
  ldap:
    implementation: 'lldap'
    address: 'ldap://lldap:3890'
    base_dn: '{{ env "LLDAP_BASE_DN" }}'
    user: 'uid=authelia,ou=people,{{ env "LLDAP_BASE_DN" }}'
    password: '{{ env "LLDAP_AUTHELIA_PASS" }}'

  # --- RETOUR ARRIÈRE ---
  # Commenter le bloc `ldap:` ci-dessus, décommenter celui-ci, redémarrer. Le fichier
  # `users_database.yml` n'est pas supprimé par la bascule : il reste le recours tant
  # que les comptes qu'il contient existent.
  #
  # file:
  #   path: '/config/users_database.yml'
  #   password:
  #     algorithm: 'argon2'
  #     argon2:
  #       variant: 'argon2id'
  #       iterations: 3
  #       memory: 65536
  #       parallelism: 4

# --- Politique d'accès : tout refusé par défaut, second facteur CIBLÉ ---
#
# Arbitrage du 2026-09-06, pris pour l'arrivée de stagiaires. `two_factor` partout exigeait
# de chacun une application d'authentification sur un téléphone lui appartenant — ce qui,
# pour des stagiaires, poussait vers un COMPTE PARTAGÉ. Or un compte partagé coûte cher
# dans cet outil, et le coût est invisible : `undo.py` filtre l'annulation par AGENT, donc
# Ctrl+Z défait l'action d'un collègue ; l'accord inter-annotateurs (ANN-5) n'a plus rien à
# mesurer, tout le monde étant la même personne ; et le journal de provenance aplatit les
# chaînes de révision.
#
# La difficulté n'était pas le second facteur, c'était le TOTP qui exige un appareil. On
# garde donc des comptes NOMINATIFS — provenance, undo et accord restent justes — et l'on
# place le second facteur là où le risque est réel, plutôt que partout.
#
# L'ORDRE compte : Authelia applique la PREMIÈRE règle qui correspond. Les deux règles
# exigeantes doivent donc précéder la règle générale.
access_control:
  default_policy: 'deny'
  rules:
    # 1. Les administrateurs gardent le second facteur PARTOUT. Ce sont eux qui peuvent
    #    élargir un cercle d'accès et lire toute collection (AUTH-4) ; ils sont peu
    #    nombreux, et ils ont déjà leur appareil enrôlé.
    - domain: '{{ env "BD_DOMAINE" }}'
      subject: 'group:bd-admins'
      policy: 'two_factor'

    # 2. La sauvegarde déverse la BASE ENTIÈRE, et son dépôt distant l'expédie ailleurs.
    #    L'application les réserve déjà aux administrateurs (DROIT-1), donc la règle 1
    #    couvre le cas nominal ; celle-ci est la ceinture qui reste si cette réservation
    #    changeait un jour côté application.
    - domain: '{{ env "BD_DOMAINE" }}'
      resources:
        - '^/api/sauvegarde$'
        - '^/api/sharedocs/deposer-sauvegarde$'
      policy: 'two_factor'

    # 3. L'annuaire (AUTH-7). `default_policy: 'deny'` fait le reste du travail : sans
    #    cette règle, ce domaine serait refusé à tout le monde — fermeture par défaut,
    #    et c'est la bonne façon d'ajouter une surface. `two_factor` parce qu'on y crée
    #    et supprime des comptes ; `bd-admins` parce que créer exige `lldap_admin`, qui
    #    inclut supprimer, et qu'il n'existe pas de rôle « peut inscrire seulement ».
    - domain: '{{ env "ANNUAIRE_DOMAINE" }}'
      subject: 'group:bd-admins'
      policy: 'two_factor'

    # 4. Le reste : mot de passe seul. C'est un ABAISSEMENT assumé par rapport au
    #    2026-09-05, et il se paie sur les scans — un mot de passe suffit désormais à les
    #    atteindre. Il reste très au-dessus de l'état d'avant INFRA-1, où l'instance
    #    n'authentifiait personne.
    - domain: '{{ env "BD_DOMAINE" }}'
      policy: 'one_factor'

# --- Sessions (Redis) : permet une déconnexion propre + expiration ---
session:
  name: 'authelia_session'
  # Demandé par l'équipe le 2026-09-06 : « 15 min, c'est trop peu ; minimum 30 min, voire
  # 1 h ». C'est `inactivity` qui se faisait sentir — le délai d'INACTIVITÉ, pas la durée
  # de la session. Annoter, c'est lire une planche, ouvrir un dictionnaire, revenir : le
  # travail lui-même produit des silences de plus d'un quart d'heure.
  #
  # LES DEUX sont relevées, et pas par excès de zèle. La documentation d'Authelia définit
  # `expiration` par « the period of time before the cookie expires » sans dire si elle est
  # RAFRAÎCHIE à chaque requête ou si elle plafonne depuis la connexion. Selon la réponse,
  # ne toucher qu'à `inactivity` donnerait soit le résultat voulu, soit une déconnexion au
  # bout d'une heure de travail CONTINU — le contraire de ce qui est demandé. Lever les
  # deux rend le réglage indépendant de cette incertitude : `inactivity` borne, quoi qu'il
  # arrive, et 12 h couvre une journée de travail si `expiration` est un plafond absolu.
  #
  # Ce que cela coûte en sécurité, et pourquoi c'est peu : `remember_me` accorde déjà UN
  # MOIS à qui coche la case au portail. Les 15 minutes ne bordaient donc que les personnes
  # qui ne la cochent pas — une friction pour les prudents, aucune gêne pour les autres.
  # Un réglage strict qui voisine avec un réglage permissif ne protège rien ; il apprend
  # seulement à cocher la case.
  expiration: '12 hours'
  inactivity: '1 hour'
  remember_me: '1 month'
  # secret -> AUTHELIA_SESSION_SECRET
  cookies:
    - domain: '{{ env "COOKIE_DOMAINE" }}'                       # domaine PARENT commun aux TROIS sous-domaines
      authelia_url: 'https://{{ env "AUTH_DOMAINE" }}'
      default_redirection_url: 'https://{{ env "BD_DOMAINE" }}'
  redis:
    host: 'redis'
    port: 6379

# --- Anti-bruteforce : bannit après 3 échecs ---
regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  # encryption_key -> AUTHELIA_STORAGE_ENCRYPTION_KEY
  local:
    path: '/config/db.sqlite3'

# --- Notifications (liens d'enregistrement 2FA / réinitialisation de mot de passe) ---
#
# DEUX modes, et c'est `.env` qui tranche : `SMTP_ADRESSE` renseignée → courriel réel ;
# vide → écriture dans un fichier. Le second est le mode de démarrage — aucun compte mail
# requis — et il reste le REPLI : vider `SMTP_ADRESSE` puis redémarrer ramène l'instance à
# un état qui a toujours fonctionné, sans éditer ce fichier ni annuler un commit.
#
# TOUJOURS valider avant de redémarrer, le filtre `template` étant appliqué :
#   docker compose exec authelia authelia validate-config --config /config/configuration.yml
notifier:
  # Par défaut, Authelia se CONNECTE au serveur SMTP à son démarrage et refuse de démarrer
  # si l'échange échoue. On le désactive, et c'est un arbitrage, pas une commodité.
  #
  # Ce contrôle vérifie la connexion et l'authentification — jamais la remise. Or un envoi
  # d'essai, qui est de toute façon la seule preuve acceptable, prouve strictement plus. Il
  # n'apporte donc aucune information qu'on n'ait pas autrement, et il fabrique en échange
  # une dépendance ABSURDE : plus personne n'entre dans l'atelier parce qu'un serveur de
  # courriel ne répond pas.
  #
  # Le cas n'est pas théorique ici. La boîte d'expédition est PARTAGÉE avec un autre site
  # du même serveur (créer une adresse dédiée est payant chez l'hébergeur). Le jour où son
  # mot de passe change pour une raison étrangère à ce projet, rien ne casse — puis un
  # redémarrage quelconque, des mois plus tard, fermerait tout, pour une cause invisible et
  # située ailleurs.
  #
  # Ce qu'on perd, et qui doit être connu : un SMTP cassé devient SILENCIEUX. Aucun
  # courriel ne part, aucun message ne le dit, et le notifier fichier n'est plus là pour
  # servir de recours. Le diagnostic est `docker compose logs authelia`, qui journalise
  # chaque échec d'envoi — et le repli reste de vider `SMTP_ADRESSE`.
  disable_startup_check: true
{{- if env "SMTP_ADRESSE" }}
  smtp:
    # Forme URI : 'submissions://hote:465' (TLS implicite) ou 'submission://hote:587'
    # (STARTTLS). Préférer 465 quand le fournisseur l'offre : le chiffrement n'y dépend
    # pas d'une négociation qu'un intermédiaire peut faire échouer.
    address: '{{ env "SMTP_ADRESSE" }}'
    username: '{{ env "SMTP_UTILISATEUR" }}'
    # Le mot de passe vit ICI, dans la branche conditionnelle, et non dans une variable
    # `AUTHELIA_NOTIFIER_SMTP_PASSWORD`. L'exposition est la MÊME — les deux lisent
    # l'environnement du processus, et `.env` reste hors de git — mais celle-ci
    # disparaît avec la branche. L'autre survivait à la bascule et ajoutait un notifier
    # SMTP que ce fichier n'avait pas demandé.
    password: '{{ env "SMTP_MOT_DE_PASSE" }}'
    # Expéditeur au format RFC 5322. Garder le nom affiché en ASCII : certains relais
    # rejettent un en-tête accentué non encodé, et l'échec ressemble à un problème
    # d'authentification.
    sender: '{{ env "SMTP_EXPEDITEUR" }}'
{{- else }}
  filesystem:
    filename: '/config/notification.txt'
{{- end }}
