# Configuration Authelia 4.38 — portail d'authentification.
# Les SECRETS ne sont PAS ici : ils sont injectés par variables d'environnement
# (voir docker-compose.yml + deploy/.env). Les domaines sont ceux de l'instance :
# `sslip.io` résout n'importe quel nom contenant une IP vers cette IP, ce qui donne
# de vrais sous-domaines sans en posséder aucun — le temps que le DNS définitif suive.

theme: 'light'

server:
  address: 'tcp://:9091'

log:
  level: 'info'

# La méthode proposée D'ABORD au second facteur. Sans ce réglage, Authelia ouvre sur la
# clé de sécurité (WebAuthn) — constaté le 2026-09-06 sur le premier compte d'essai : la
# personne venait d'enrôler un TOTP, et l'écran lui répondait « Enregistrez votre premier
# appareil ». Le message est exact pour WebAuthn et parfaitement trompeur pour qui vient
# de terminer un enrôlement : il se lit comme « rien n'est enregistré », et un arrivant
# seul en conclut que son inscription a échoué.
#
# WebAuthn reste disponible — c'est un facteur plus fort, on ne le retire pas ; il cesse
# seulement d'être celui qu'on propose à quelqu'un qui n'en a pas.
default_2fa_method: 'totp'

# --- TOTP (application d'authentification 2FA : Google Authenticator, Aegis…) ---
totp:
  issuer: '{{ env "BD_DOMAINE" }}'

identity_validation:
  reset_password:
    # 5 minutes suffisaient quand le lien s'allait lire dans un fichier sur le serveur.
    # Par courriel, le délai de remise s'ajoute à celui de la personne qui relève sa
    # boîte : un lien expiré ressemble alors à une panne, et l'on recommence en boucle.
    jwt_lifespan: '15 minutes'
    # jwt_secret -> AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET

# --- Comptes : fichier local (suffisant pour une petite équipe) ---
authentication_backend:
  password_reset:
    disable: false
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4

# --- Politique d'accès : tout refusé par défaut, 2FA exigé sur l'app ---
access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ env "BD_DOMAINE" }}'
      policy: 'two_factor'      # mets 'one_factor' si tu ne veux PAS imposer la 2FA

# --- Sessions (Redis) : permet une déconnexion propre + expiration ---
session:
  name: 'authelia_session'
  expiration: '1 hour'
  inactivity: '15 minutes'
  remember_me: '1 month'
  # secret -> AUTHELIA_SESSION_SECRET
  cookies:
    - domain: '{{ env "COOKIE_DOMAINE" }}'                       # domaine PARENT commun aux deux sous-domaines
      authelia_url: 'https://{{ env "AUTH_DOMAINE" }}'
      default_redirection_url: 'https://{{ env "BD_DOMAINE" }}'
  redis:
    host: 'redis'
    port: 6379

# --- Anti-bruteforce : bannit après 3 échecs ---
regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  # encryption_key -> AUTHELIA_STORAGE_ENCRYPTION_KEY
  local:
    path: '/config/db.sqlite3'

# --- Notifications (liens d'enregistrement 2FA / réinitialisation de mot de passe) ---
#
# DEUX modes, et c'est `.env` qui tranche : `SMTP_ADRESSE` renseignée → courriel réel ;
# vide → écriture dans un fichier. Le second est le mode de démarrage — aucun compte mail
# requis — et il reste le REPLI : vider `SMTP_ADRESSE` puis redémarrer ramène l'instance à
# un état qui a toujours fonctionné, sans éditer ce fichier ni annuler un commit.
#
# TOUJOURS valider avant de redémarrer, le filtre `template` étant appliqué :
#   docker compose exec authelia authelia validate-config --config /config/configuration.yml
notifier:
  # Par défaut, Authelia se CONNECTE au serveur SMTP à son démarrage et refuse de démarrer
  # si l'échange échoue. On le désactive, et c'est un arbitrage, pas une commodité.
  #
  # Ce contrôle vérifie la connexion et l'authentification — jamais la remise. Or un envoi
  # d'essai, qui est de toute façon la seule preuve acceptable, prouve strictement plus. Il
  # n'apporte donc aucune information qu'on n'ait pas autrement, et il fabrique en échange
  # une dépendance ABSURDE : plus personne n'entre dans l'atelier parce qu'un serveur de
  # courriel ne répond pas.
  #
  # Le cas n'est pas théorique ici. La boîte d'expédition est PARTAGÉE avec un autre site
  # du même serveur (créer une adresse dédiée est payant chez l'hébergeur). Le jour où son
  # mot de passe change pour une raison étrangère à ce projet, rien ne casse — puis un
  # redémarrage quelconque, des mois plus tard, fermerait tout, pour une cause invisible et
  # située ailleurs.
  #
  # Ce qu'on perd, et qui doit être connu : un SMTP cassé devient SILENCIEUX. Aucun
  # courriel ne part, aucun message ne le dit, et le notifier fichier n'est plus là pour
  # servir de recours. Le diagnostic est `docker compose logs authelia`, qui journalise
  # chaque échec d'envoi — et le repli reste de vider `SMTP_ADRESSE`.
  disable_startup_check: true
{{- if env "SMTP_ADRESSE" }}
  smtp:
    # Forme URI : 'submissions://hote:465' (TLS implicite) ou 'submission://hote:587'
    # (STARTTLS). Préférer 465 quand le fournisseur l'offre : le chiffrement n'y dépend
    # pas d'une négociation qu'un intermédiaire peut faire échouer.
    address: '{{ env "SMTP_ADRESSE" }}'
    username: '{{ env "SMTP_UTILISATEUR" }}'
    # Le mot de passe vit ICI, dans la branche conditionnelle, et non dans une variable
    # `AUTHELIA_NOTIFIER_SMTP_PASSWORD`. L'exposition est la MÊME — les deux lisent
    # l'environnement du processus, et `.env` reste hors de git — mais celle-ci
    # disparaît avec la branche. L'autre survivait à la bascule et ajoutait un notifier
    # SMTP que ce fichier n'avait pas demandé.
    password: '{{ env "SMTP_MOT_DE_PASSE" }}'
    # Expéditeur au format RFC 5322. Garder le nom affiché en ASCII : certains relais
    # rejettent un en-tête accentué non encodé, et l'échec ressemble à un problème
    # d'authentification.
    sender: '{{ env "SMTP_EXPEDITEUR" }}'
{{- else }}
  filesystem:
    filename: '/config/notification.txt'
{{- end }}
