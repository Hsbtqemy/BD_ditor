# Pile d'hébergement BéDéditeur :
#   caddy     -> reverse proxy + HTTPS automatique + délègue l'auth à Authelia
#   authelia  -> portail d'authentification (comptes, login/logout, 2FA)
#   redis     -> stockage des sessions Authelia (déconnexion propre, expiration)
#   app       -> l'application FastAPI (JAMAIS exposée directement)
#
# Seul Caddy publie des ports (80/443). app/authelia/redis ne sont joignables
# que sur le réseau interne Docker -> rien n'est accessible sans passer par l'auth.

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Étiquette le commit servi par l'image (cf. Dockerfile, LABEL bd.commit).
        # `deployer.sh` l'exporte ; construite à la main, l'image vaut « inconnu », et
        # le script le DIT au lieu de conclure.
        BD_COMMIT: ${BD_COMMIT:-inconnu}
      # Étape EXPLICITE (QA-5). Sans elle, compose prend la dernière du Dockerfile — ce
      # qui donne le bon résultat aujourd'hui, mais silencieusement le mauvais le jour où
      # quelqu'un ajoute une étape après `runtime`. On ne livre pas une image de test par
      # accident d'ordre de déclaration.
      target: runtime
    container_name: bd-app
    restart: unless-stopped
    environment:
      - BD_DATA_DIR=/data
      - HOME=/data
      # AUTH-1 : déclare qu'on est DERRIÈRE le proxy d'auth. Sans ce drapeau, l'app
      # IGNORE `Remote-User`/`Remote-Groups` et tout acte reste anonyme — la garde
      # anti-usurpation. Ne le poser QUE si Caddy fait bien le `forward_auth` vers
      # Authelia devant l'app : sinon n'importe quel client pourrait se déclarer
      # qui il veut, et ce sera une escalade de privilège dès AUTH-2/AUTH-3.
      - BD_AUTH_PROXY=1
      # Lien de déconnexion affiché dans l'UI (portail Authelia).
      - BD_AUTH_LOGOUT_URL=https://${AUTH_DOMAINE}/logout
      # AUTH-2 : groupes dont les membres voient TOUT le corpus et administrent les accès.
      # Doit correspondre à un groupe déclaré dans Authelia. Les autres n'accèdent qu'aux
      # collections ouvertes pour eux dans `collection_acces` — et une instance neuve n'en
      # ouvre aucune, donc SANS au moins un administrateur, personne ne voit rien.
      # - BD_AUTH_ADMIN_GROUPS=bd-admins   # défaut ; décommenter pour changer de nom
      # AUTH-4 : à qui écrire quand on est bloqué. Le SEUL référent lisible par une portée
      # VIDE — donc par la personne que le bandeau envoie « demander un accès » sans lui
      # dire à qui. Il est déclaratif : l'app ne connaît les groupes que de la personne qui
      # frappe, elle ne peut donc pas vérifier que ce nom appartient encore à l'équipe.
      # CONTACT accepte un courriel ou l'URL d'une page d'instance.
      #
      # Il passe par `.env` comme les domaines, et pour la même raison : décommenter une
      # ligne ICI ferait diverger un fichier versionné, donc un conflit à chaque `git pull`
      # sur le serveur. `:-` fournit la chaîne vide plutôt que de laisser Compose avertir
      # à chaque commande, et `config.py` lit cette chaîne vide comme « pas de référent ».
      - BD_REFERENT_NOM=${BD_REFERENT_NOM:-}
      - BD_REFERENT_CONTACT=${BD_REFERENT_CONTACT:-}
      # - BD_SPACY_MODEL=fr_core_news_sm   # modèle NLP (lg = index plus riche, + de RAM)
      # - BD_NLP_PREWARM=1                  # charge spaCy au démarrage (évite le gel de
      #                                     #  la 1re écriture) ; à éviter en consultation pure
    volumes:
      - bd-data:/data            # corpus, dérivés, base SQLite, caches de modèles
    expose:
      - "8000"                   # visible seulement des autres conteneurs

  redis:
    image: redis:7-alpine
    container_name: bd-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  authelia:
    # Version EXACTE, et non la mineure flottante `4.38` qui précédait. Le choix se
    # paie dans les deux sens, et c'est la panne vécue qui tranche : la flottante prend
    # bien les correctifs de SA branche, mais elle a laissé l'instance vieillir en
    # silence — `docker compose pull` réussissait, tirait fidèlement la dernière image
    # d'une branche abandonnée, et rien nulle part ne disait que 4.38 ne recevait plus
    # aucun correctif de bogue. Un déploiement qui se croit à jour.
    #
    # Le coût assumé : plus rien n'arrive tout seul, pas même un correctif de sécurité.
    # Monter devient un GESTE, ce qui est le bon régime pour le seul point d'entrée de
    # l'instance — et l'écart se voit, au lieu de se creuser (INFRA-9).
    image: authelia/authelia:4.39.22
    container_name: bd-authelia
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      # `template` fait lire les `{{ env "…" }}` de configuration.yml. Sans ce filtre,
      # Authelia prend l'expression pour un nom de domaine LITTÉRAL : il démarre, et la
      # session ne se pose jamais. Le filtre est déclaré stable par sa documentation.
      # L'entrypoint de l'image fait `chown -R ${PUID}:${PGID} /config` à CHAQUE
      # démarrage. Non déclarées, ces variables valent 0:0 : le dossier monté —
      # `deploy/authelia/`, qui contient des fichiers SUIVIS PAR GIT — repassait donc à
      # root à chaque redémarrage d'Authelia, et le `git pull` suivant échouait sur
      # « unable to unlink old 'deploy/authelia/configuration.yml' » en laissant HEAD en
      # arrière. Trois occurrences (2026-09-05, deux le 09-06) avant qu'on regarde
      # l'entrypoint : les deux premières ont été traitées par un `chown` manuel, que le
      # redémarrage suivant annulait. Une réparation vérifiée entre deux redémarrages est
      # juste et sans valeur.
      #
      # 1000:1000 est l'uid/gid d'`ubuntu` sur cet hôte. Authelia s'exécute ensuite sous
      # cette identité (`su-exec`), donc il écrit toujours `db.sqlite3` — il en devient
      # propriétaire au lieu de l'être en root.
      - PUID=${BD_PUID:-1000}
      - PGID=${BD_PGID:-1000}
      - X_AUTHELIA_CONFIG_FILTERS=template
      # Les domaines, depuis deploy/.env — le fichier de config reste un gabarit.
      - BD_DOMAINE=${BD_DOMAINE}
      - AUTH_DOMAINE=${AUTH_DOMAINE}
      - COOKIE_DOMAINE=${COOKIE_DOMAINE}
      # Secrets injectés depuis deploy/.env (voir .env.example pour les générer)
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      # Courriel (INFRA-8). Les QUATRE valeurs passent par le gabarit, mot de passe
      # compris, et AUCUNE ne prend la forme `AUTHELIA_NOTIFIER_SMTP_*`.
      #
      # La première version faisait autrement — le mot de passe par une variable
      # `AUTHELIA_*`, comme les trois secrets ci-dessus — et cette élégance a fermé
      # l'instance. Cette variable INSTANCIE le notifier SMTP à elle seule : posée
      # pendant que `SMTP_ADRESSE` était vide, elle ajoutait `smtp` par
      # l'environnement pendant que le gabarit posait `filesystem`, et Authelia
      # refuse d'avoir les deux. Le repli avait le même angle mort, puisqu'il ne
      # retirait que l'adresse.
      #
      # La règle qui reste : une CHOSE se configure à UN endroit. Ici, le gabarit.
      # `SMTP_ADRESSE` vide = notifier fichier, l'état de démarrage et le repli.
      - SMTP_ADRESSE=${SMTP_ADRESSE:-}
      - SMTP_UTILISATEUR=${SMTP_UTILISATEUR:-}
      - SMTP_EXPEDITEUR=${SMTP_EXPEDITEUR:-}
      - SMTP_MOT_DE_PASSE=${SMTP_MOT_DE_PASSE:-}
    volumes:
      - ./authelia:/config
    expose:
      - "9091"

  caddy:
    image: caddy:2-alpine
    container_name: bd-caddy
    restart: unless-stopped
    depends_on:
      - app
      - authelia
    environment:
      # Caddy résout `{$VAR}` lui-même, à partir de SON environnement : compose ne
      # substitue rien dans un fichier qu'il ne fait que monter.
      - BD_DOMAINE=${BD_DOMAINE}
      - AUTH_DOMAINE=${AUTH_DOMAINE}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data         # certificats TLS (persistés -> pas de re-émission)
      - caddy-config:/config

volumes:
  bd-data:
  redis-data:
  caddy-data:
  caddy-config:
