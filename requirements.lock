# pillow est PLAFONNÉ par un paquet qui n'est pas dans ce fichier, et c'est la seule
# raison de ne pas le monter : `iiif-prezi3==3.1.1` (requirements-export.txt) exige
# `Pillow<=12.0.0` en dépendance OBLIGATOIRE. Épinglé à 12.1.0 en juin 2026 sur le jeu
# « connu-bon du moment », il rendait `iiif-prezi3` ININSTALLABLE à côté du verrou
# (`ResolutionImpossible`), donc le test de conformance IIIF se skippait dans l'image —
# et un skip se lit comme un succès. Redescendu le 2026-09-07 (QA-4) : rien dans le dépôt
# ne demande 12.1 (`pipeline/` n'appelle qu'`Image.open`/`resize`/`LANCZOS`), et
# `requirements.txt` dit `pillow>=10.0`. Le remonter REFERME la validation IIIF stricte —
# mais plus en silence : `requirements-export.txt` porte désormais la borne `pillow<=12.0.0`,
# et `tests/test_verrou_dependances.py` échoue. Monter `iiif-prezi3` d'abord — sachant
# que ce plafond RETIENT le correctif de CVE-2026-25990 (Pillow 12.1.1) : l'arbitrage et
# son contournement sont écrits dans `requirements-export.txt`, à côté de la borne.
