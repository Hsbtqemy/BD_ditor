<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BéDéditeur — Annotation</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/lib/zoom.js"></script><!-- la borne du zoom, lue par theme.js -->
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="annot-app">

  <!-- ───────────── Bande 1 — Navigation du site (identique partout) ───────────── -->
  <div id="site-nav">
    <span class="brand"><span class="brand-long">BéDéditeur</span><span class="brand-court" aria-hidden="true">BDé</span></span>
    <nav class="surf-nav"></nav><!-- liens injectés par theme.js (source unique) -->
    <span class="nav-spacer"></span>
    <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
    <button class="ghost btn-theme" title="Changer de thème">🌙</button>
  </div>

  <!-- ───────────── Bande 2 — Collection · Album · Planche (ANN-7, tranche 2) ─────────────
       Les listes du PROJET COURANT ; la collection est le filtre de l'Atelier, partagé avec
       lui. « Préparée » dit ce que la planche porte ; « Ouvrir dans l'Atelier ↗ » y mène sur
       la même zone. -->
  <header id="header" class="an-header">
    <h1 class="sr-only">Annotation</h1>
    <span class="an-champ"><label for="an-collection">Collection</label><select id="an-collection"></select></span>
    <span class="an-champ"><label for="an-album">Album</label><select id="an-album"></select></span>
    <span class="an-champ"><label for="an-planche-choix">Planche</label><select id="an-planche-choix"></select></span>
    <span id="an-preparee" class="muted small an-preparee" title="Zones de texte de la planche, et sa relecture"></span>
    <span class="nav-spacer"></span>
    <a id="an-atelier" class="ghost an-atelier" href="/" title="Ouvrir cette zone dans l'Atelier">Ouvrir dans l'Atelier ↗</a>
  </header>

  <!-- ───────────── Corps — trois colonnes, de taille STABLE pendant le travail ─────────────
       La planche et son Contexte · la case agrandie · la grille. Rien n'y change de hauteur
       quand on passe d'une case ou d'une zone à l'autre (Hugo, 2026-10-14). -->
  <main id="annot" class="annot">
    <aside id="an-gauche" class="an-col an-gauche" aria-labelledby="an-mini-titre">
      <h2 class="an-titre" id="an-mini-titre">Planche</h2>
      <div id="an-mini" class="an-mini" title="Choisir une case"></div>
      <section class="an-ctx" aria-labelledby="an-ctx-titre">
        <h2 class="an-titre" id="an-ctx-titre"
            title="Ce qui n'est pas du vocabulaire : il se lit ici, et s'écrit dans l'Atelier">Contexte</h2>
        <dl id="an-ctx-corps" class="an-ctx-corps"></dl>
      </section>
    </aside>

    <section id="an-zone" class="an-col an-zone" aria-labelledby="an-tete-case">
      <div class="an-tete">
        <h2 class="an-titre" id="an-tete-case">—</h2>
        <span id="an-tete-zone" class="an-badge"></span>
        <span class="nav-spacer"></span>
        <span id="an-tete-rang" class="muted small" title="Rang de la case dans l'ordre de lecture"></span>
      </div>
      <div id="an-vue-case" class="an-vue-case"
           title="Cliquez une zone pour la choisir, ou le fond pour la case"></div>
      <div id="an-zones" class="an-zones" role="group" aria-label="Zones de la case"></div>
      <!-- « Porte sur » (commit 3) : ce que la grille ouverte vise depuis la zone choisie. -->
      <div id="an-porte" class="an-porte" role="group" aria-label="Le relevé porte sur"></div>
      <!-- Les MOTS de la zone, à désigner : clic, glissé, Maj+clic, Ctrl+clic, clavier.
           Sous chacun, les traits des relevés, un couloir par relevé. -->
      <section class="an-texte-bloc" aria-labelledby="an-texte-titre">
        <div class="an-mots-tete">
          <h3 class="an-sous-titre" id="an-texte-titre">Texte</h3>
          <span id="an-legende" class="an-legende" aria-hidden="true"></span>
        </div>
        <div id="an-mots" class="an-mots muted"
             title="Clic, glisser ou Maj+clic : un passage. Ctrl+clic : ajouter ou retirer un mot (« ne … pas »). Au clavier : flèches, Maj+flèches, Espace, Entrée pour chercher dans la grille, Échap pour ne rien désigner.">—</div>
      </section>
    </section>

    <!-- La GRILLE (commit 2), en lecture : les onglets des grilles actives que la collection
         ne masque pas, « Afficher », le filtre (« / »), le plan, la ligne du guide à hauteur
         fixe et le guide complet. -->
    <aside id="an-grille" class="an-col an-grille" aria-labelledby="an-grille-titre">
      <div class="an-gr-tete">
        <h2 class="an-titre" id="an-grille-titre">Grille</h2>
        <div id="an-onglets" class="an-onglets" role="tablist" aria-labelledby="an-grille-titre"></div>
        <div class="an-gr-ligne">
          <label for="an-afficher" class="an-gr-lbl">Afficher</label>
          <select id="an-afficher" title="Toute la grille, ou une seule rubrique"></select>
        </div>
        <div class="an-filtre-wrap">
          <input type="text" id="an-filtre"
                 aria-controls="an-resultats" aria-autocomplete="list" autocomplete="off"
                 spellcheck="false" placeholder="Chercher dans la grille…"
                 aria-label="Chercher dans la grille"
                 title="Accents, apostrophes et exemples compris ; « X par Y » pour un qualificatif. ↓ ↑ pour choisir, Échap pour vider.">
          <kbd aria-hidden="true">/</kbd>
        </div>
      </div>
      <div id="an-grille-corps" class="an-grille-corps" role="tabpanel" aria-labelledby="an-grille-titre">
        <div id="an-plan" class="an-plan"></div>
        <ul id="an-resultats" class="an-resultats" role="listbox" aria-label="Résultats" hidden></ul>
        <div id="an-ailleurs" class="an-ailleurs"></div>
      </div>
      <!-- Ce qui est posé (commit 3) : sur les mots désignés, sinon sur la zone ; « Relevés : ▾ »
           règle de quelles grilles. -->
      <section id="an-poses" class="an-poses" aria-labelledby="an-poses-titre">
        <div class="an-poses-tete">
          <h3 class="an-sous-titre" id="an-poses-titre">—</h3>
          <button id="an-releves-btn" class="ghost small an-releves-btn" type="button"
                  aria-expanded="false" aria-controls="an-releves-pop"
                  title="Les grilles dont les relevés s'affichent ici et sous les mots">Relevés ▾</button>
        </div>
        <div id="an-releves-pop" class="an-releves-pop" role="group"
             aria-label="Grilles dont les relevés s'affichent" hidden></div>
        <ul id="an-poses-liste" class="an-poses-liste"></ul>
      </section>
      <div id="an-guide" class="an-guide" aria-live="polite">
        <div id="an-guide-contenu" class="an-guide-contenu"></div>
        <div class="an-guide-pied">
          <button id="an-guide-complet" class="ghost small" type="button">Guide complet ▸</button>
        </div>
      </div>
    </aside>
  </main>
  <!-- Ce qu'on pose, retire ou refuse, dit au lecteur d'écran. -->
  <p id="an-annonce" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Le guide complet, PRODUIT depuis la grille (modale `BDDialog`). -->
  <div id="an-guide-modal" hidden>
    <div class="modal-box an-guide-box">
      <h3 id="an-guide-titre">Guide</h3>
      <div id="an-guide-corps" class="an-guide-corps" tabindex="0" role="region"
           aria-labelledby="an-guide-titre"></div>
      <div class="modal-actions">
        <button id="an-guide-fermer" class="ghost small" type="button">Fermer</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/lib/common.js"></script>
<script src="/static/lib/nav.js"></script>
<script src="/static/lib/projet.js"></script>
<script src="/static/lib/bibliotheque.js"></script><!-- l'ordre des collections, celui de l'Atelier -->
<script src="/static/lib/atelier.js"></script><!-- le filtre de collection, partagé avec l'Atelier -->
<script src="/static/lib/conflit.js"></script><!-- les mots du bandeau de CONC-3 -->
<script src="/static/lib/annotation.js"></script>
<script src="/static/lib/dialog.js"></script>
<script src="/static/lib/membres-projet.js"></script>
<script src="/static/lib/bac-a-sable.js"></script>
<script src="/static/bac-a-sable.js"></script><!-- COL-4 : « Mon bac à sable » et sa ligne, sur les six surfaces -->
<script src="/static/annotation.js"></script>
</body>
</html>
