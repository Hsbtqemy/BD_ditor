<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BéDéditeur — Annotation</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/lib/zoom.js"></script><!-- la borne du zoom, lue par theme.js -->
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="annot-app">

  <!-- ───────────── Bande 1 — Navigation du site (identique partout) ───────────── -->
  <div id="site-nav">
    <span class="brand"><span class="brand-long">BéDéditeur</span><span class="brand-court" aria-hidden="true">BDé</span></span>
    <nav class="surf-nav"></nav><!-- liens injectés par theme.js (source unique) -->
    <span class="nav-spacer"></span>
    <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
    <button class="ghost btn-theme" title="Changer de thème">🌙</button>
  </div>

  <!-- ───────────── Bande 2 — Collection · Album · Planche (ANN-7, tranche 2) ─────────────
       Les listes du PROJET COURANT ; la collection est le filtre de l'Atelier, partagé avec
       lui. « Préparée » dit ce que la planche porte ; « Ouvrir dans l'Atelier ↗ » y mène sur
       la même zone. -->
  <header id="header" class="an-header">
    <h1 class="sr-only">Annotation</h1>
    <span class="an-champ"><label for="an-collection">Collection</label><select id="an-collection"></select></span>
    <span class="an-champ"><label for="an-album">Album</label><select id="an-album"></select></span>
    <span class="an-champ"><label for="an-planche-choix">Planche</label><select id="an-planche-choix"></select></span>
    <span id="an-preparee" class="muted small an-preparee" title="Zones de texte de la planche, et sa relecture"></span>
    <!-- CONC-4 (commit 6) : la planche a changé ailleurs — régions, relevés, passes, doutes. -->
    <button id="an-actualiser" class="ghost small" type="button" hidden>⟳ Actualiser</button>
    <span class="nav-spacer"></span>
    <a id="an-atelier" class="ghost an-atelier" href="/" title="Ouvrir cette zone dans l'Atelier">Ouvrir dans l'Atelier ↗</a>
  </header>

  <!-- ───────────── Corps — trois colonnes, de taille STABLE pendant le travail ─────────────
       La planche et son Contexte · la case agrandie · la grille. Rien n'y change de hauteur
       quand on passe d'une case ou d'une zone à l'autre (Hugo, 2026-10-14). -->
  <main id="annot" class="annot">
    <!-- Deux vues de la colonne de gauche (ANN-6, 2026-10-14 : « Vue planche et vue synthèse
         du travail effectué ») : la planche et son Contexte ; la Synthèse (commit 5) — les
         relevés de la planche par case, ce qui est à revoir, le décompte. -->
    <aside id="an-gauche" class="an-col an-gauche" aria-label="Planche et synthèse">
      <div class="an-gauche-tete">
        <div class="an-gauche-onglets" role="tablist" aria-label="Planche ou synthèse">
          <button type="button" role="tab" id="an-ong-planche" class="ghost an-onglet"
                  aria-selected="true" aria-controls="an-p-planche">Planche</button>
          <button type="button" role="tab" id="an-ong-synthese" class="ghost an-onglet"
                  aria-selected="false" aria-controls="an-p-synthese" tabindex="-1"
                  title="Les relevés de la planche, ce qui est à revoir, le décompte">Synthèse<span
                  id="an-n-revoir" class="an-n"></span></button>
        </div>
        <!-- Sous 75em, cette colonne est un tiroir (commit 12) : sa bascule est dans la tête de
             la case. -->
        <button id="an-gauche-fermer" class="ghost small an-etroit" type="button"
                title="Échap">Fermer ✕</button>
      </div>
      <div id="an-p-planche" class="an-panneau" role="tabpanel" aria-labelledby="an-ong-planche">
        <h2 class="an-titre" id="an-mini-titre">Planche</h2>
        <div class="an-mini-boite">
          <div id="an-mini" class="an-mini" title="Choisir une case"></div>
          <!-- Désigner un lien (commit 7) : la minicarte change de rôle, et le dit sur elle. -->
          <p id="an-mini-mode" class="an-mini-mode" hidden>Cliquez la zone liée · Échap annule</p>
        </div>
        <!-- Le Contexte (commit 8) : ce qui n'est pas du vocabulaire. Sur un album où l'on
             écrit, le locuteur et la note s'écrivent ICI ; le personnage d'une boîte reste en
             lecture. Les lignes sont FIXES : la zone choisie les montre ou les cache. -->
        <section class="an-ctx" aria-labelledby="an-ctx-titre">
          <h2 class="an-titre" id="an-ctx-titre"
              title="Ce qui n'est pas du vocabulaire : le locuteur, la note">Contexte</h2>
          <dl id="an-ctx-corps" class="an-ctx-corps">
            <dt id="an-ctx-loc-t" hidden>Locuteur</dt>
            <dd id="an-ctx-loc" data-ctx="locuteur" hidden>
              <span id="an-loc-puce" class="an-loc-puce"><span id="an-loc-nom" class="an-loc-nom"></span><button
                id="an-loc-retirer" class="ghost small an-loc-x" type="button" hidden
                aria-label="Retirer le locuteur" title="Retirer le locuteur">×</button></span>
              <div id="an-loc-saisie" class="tag-input-wrap an-loc-saisie" hidden>
                <input type="text" id="an-loc-input" autocomplete="off" spellcheck="false"
                       placeholder="Attribuer un personnage…" aria-label="Attribuer un locuteur">
                <div id="an-loc-liste" class="tag-suggest" hidden></div>
              </div>
            </dd>
            <dt id="an-ctx-perso-t" hidden>Personnage</dt>
            <dd id="an-ctx-perso" data-ctx="personnage" hidden
                title="L'identité d'une boîte s'écrit dans l'Atelier"></dd>
            <dt id="an-ctx-note-t" hidden><label for="an-note" id="an-note-lbl">Note</label></dt>
            <dd id="an-ctx-note" data-ctx="note" hidden>
              <span id="an-note-lu" class="an-note-lu"></span>
              <textarea id="an-note" class="an-note" rows="2" hidden
                        title="Enregistrée en tapant ; Ctrl+Z hors du champ la défait"></textarea>
              <span id="an-note-etat" class="an-note-etat muted small" aria-live="polite"></span>
            </dd>
            <dt id="an-ctx-nom-t" hidden><label for="an-nom">Nom</label></dt>
            <dd id="an-ctx-nom" data-ctx="nom" hidden>
              <span id="an-nom-lu" class="an-note-lu"></span>
              <input type="text" id="an-nom" class="an-nom" maxlength="200" hidden
                     autocomplete="off" placeholder="Le nom de ce détail"
                     title="Écrit sur l'image ; Entrée ou la sortie du champ l'enregistrent">
            </dd>
            <dt id="an-ctx-tr-t" hidden><label for="an-transcription">Transcription</label></dt>
            <dd id="an-ctx-tr" data-ctx="transcription" hidden>
              <textarea id="an-transcription" class="an-note" rows="2" spellcheck="false"
                        title="Le texte hors bulle, tel qu'il est écrit ; enregistré à la sortie du champ"></textarea>
            </dd>
          </dl>
          <button id="an-zone-supprimer" class="ghost small an-supprimer" type="button" hidden
                  title="Une zone tracée ici, et ce qui est posé sur elle ; Ctrl+Z la rend">Supprimer cette zone</button>
        </section>
      </div>
      <div id="an-p-synthese" class="an-panneau" role="tabpanel" aria-labelledby="an-ong-synthese" hidden>
        <h2 class="sr-only" id="an-syn-titre">Synthèse de la planche</h2>
        <div id="an-syn-vues" class="an-syn-vues" role="group" aria-labelledby="an-syn-titre">
          <button type="button" class="ghost small an-syn-vue" data-syn="releves" aria-pressed="true"
                  title="Tous les relevés de la planche, case par case, dans l'ordre de lecture">Relevés</button>
          <button type="button" class="ghost small an-syn-vue" data-syn="revoir" aria-pressed="false"
                  title="Les doutes, les relevés à revoir et à compléter, les doutes levés">À revoir<span
                  id="an-syn-n" class="an-n"></span></button>
          <button type="button" class="ghost small an-syn-vue" data-syn="decompte" aria-pressed="false"
                  title="Combien de relevés, par grille, rubrique, entrée, variante et qualificatif">Décompte</button>
        </div>
        <div id="an-syn-corps" class="an-syn-corps"></div>
      </div>
    </aside>

    <section id="an-zone" class="an-col an-zone" aria-labelledby="an-tete-case">
      <div class="an-tete">
        <button id="an-tiroir-planche" class="ghost small an-etroit" type="button"
                aria-expanded="false" aria-controls="an-gauche">☰ Planche et contexte</button>
        <h2 class="an-titre" id="an-tete-case">—</h2>
        <span id="an-tete-zone" class="an-badge"></span>
        <span class="nav-spacer"></span>
        <span id="an-tete-rang" class="muted small" title="Rang de la case dans l'ordre de lecture"></span>
      </div>
      <!-- Tracer une zone (commit 9) : un glissé dans la case, puis sa sorte, proposée
           par-dessus la case (`#an-trace`, que le dessin de la case garde). -->
      <div id="an-vue-case" class="an-vue-case"
           title="Cliquez une zone pour la choisir, ou le fond pour la case ; à la souris, glissez pour tracer un détail ou un texte hors bulle"><div
           id="an-trace" class="an-trace" role="group" aria-label="La zone tracée est" hidden>
          <button type="button" class="ghost small" data-trace="detail"
                  title="Un détail de l'image, qu'on nomme">Détail d'image</button>
          <button type="button" class="ghost small" data-trace="texte"
                  title="Un texte hors bulle, qu'on transcrit puis qu'on annote">Texte hors bulle</button>
          <button type="button" class="ghost small" data-trace="" title="Échap">Annuler</button>
        </div></div>
      <div id="an-zones" class="an-zones" role="group" aria-label="Zones de la case"></div>
      <!-- « Porte sur » (commit 3) : ce que la grille ouverte vise depuis la zone choisie. -->
      <div class="an-porte-l">
        <div id="an-porte" class="an-porte" role="group" aria-label="Le relevé porte sur"></div>
        <!-- Tracer sans souris (commit 12) : au doigt, ce bouton arme le glissé ; au clavier, il
             pose un rectangle que les flèches déplacent. -->
        <button id="an-tracer" class="ghost small" type="button" aria-pressed="false" hidden
                title="Tracer une nouvelle zone dans la case : un détail d'image, ou un texte hors bulle. À la souris, il suffit de glisser.">✎ Tracer une zone</button>
      </div>
      <!-- Les MOTS de la zone, à désigner : clic, glissé, Maj+clic, Ctrl+clic, clavier.
           Sous chacun, les traits des relevés, un couloir par relevé. -->
      <section class="an-texte-bloc" aria-labelledby="an-texte-titre">
        <div class="an-mots-tete">
          <h3 class="an-sous-titre" id="an-texte-titre">Texte</h3>
          <span id="an-legende" class="an-legende" aria-hidden="true"></span>
          <span class="nav-spacer"></span>
          <!-- Au doigt (commit 12) : ce que Maj+clic et Ctrl+clic font à la souris. -->
          <span id="an-doigt" class="an-doigt" role="group" aria-label="Désigner au doigt" hidden>
            <button type="button" class="ghost small" data-doigt="etendre" aria-pressed="false"
                    title="Le prochain mot touché étend le passage jusqu'à lui">Étendre</button>
            <button type="button" class="ghost small" data-doigt="ajouter" aria-pressed="false"
                    title="Le prochain mot touché s'ajoute au passage, ou en sort">Ajouter un mot</button>
          </span>
        </div>
        <div id="an-mots" class="an-mots muted"
             title="Clic, glisser ou Maj+clic : un passage. Ctrl+clic : ajouter ou retirer un mot (« ne … pas »). Au clavier : flèches, Maj+flèches, Espace, Entrée pour chercher dans la grille, Échap pour ne rien désigner.">—</div>
      </section>
      <!-- Le PIED à deux lignes fixes (commit 4) : « terminée » pour la grille ouverte (ou la
           rubrique qu'« Afficher » montre), et le parcours de ses zones. -->
      <div id="an-pied" class="an-pied" role="group" aria-label="Terminée et parcours">
        <div class="an-pied-ligne">
          <span id="an-passe-etat" class="an-passe-etat"></span>
          <button id="an-rouvrir" class="ghost small" type="button" hidden
                  title="La zone n'est plus terminée, pour toute l'équipe">Rouvrir</button>
          <span class="nav-spacer"></span>
          <label for="an-parcours-sel" class="muted small">Parcours</label>
          <select id="an-parcours-sel" title="Ce que « Suivante » parcourt">
            <option value="tout">toutes les zones</option>
            <option value="afaire">à faire seulement</option>
          </select>
        </div>
        <div class="an-pied-ligne">
          <button id="an-prec" class="ghost" type="button"
                  title="Zone précédente (Ctrl+Maj+Entrée)">‹ Précédente</button>
          <button id="an-suiv" class="ghost" type="button"
                  title="Zone suivante, sans rien marquer (Ctrl+Entrée)">Suivante ›</button>
          <span class="nav-spacer"></span>
          <button id="an-terminee-suiv" class="primary" type="button">Terminée, suivante ›</button>
        </div>
      </div>
    </section>

    <!-- La GRILLE (commit 2), en lecture : les onglets des grilles actives que la collection
         ne masque pas, « Afficher », le filtre (« / »), le plan, la ligne du guide à hauteur
         fixe et le guide complet. -->
    <aside id="an-grille" class="an-col an-grille" aria-labelledby="an-grille-titre">
      <!-- Sous 47,5em, la grille monte du bas par « Poser… ▴ » (commit 12). -->
      <div class="an-gr-fermer-l an-etroit-feuille">
        <span class="nav-spacer"></span>
        <button id="an-grille-fermer" class="ghost small" type="button" title="Échap">Fermer ✕</button>
      </div>
      <div class="an-gr-tete">
        <h2 class="an-titre" id="an-grille-titre">Grille</h2>
        <div id="an-onglets" class="an-onglets" role="tablist" aria-labelledby="an-grille-titre"></div>
        <div class="an-gr-ligne">
          <label for="an-afficher" class="an-gr-lbl">Afficher</label>
          <select id="an-afficher" title="Toute la grille, ou une seule rubrique"></select>
        </div>
        <div class="an-filtre-wrap">
          <input type="text" id="an-filtre"
                 aria-controls="an-resultats" aria-autocomplete="list" autocomplete="off"
                 spellcheck="false" placeholder="Chercher dans la grille…"
                 aria-label="Chercher dans la grille"
                 title="Accents, apostrophes et exemples compris ; « X par Y » pour un qualificatif. ↓ ↑ pour choisir, Échap pour vider.">
          <kbd aria-hidden="true">/</kbd>
        </div>
      </div>
      <div id="an-grille-corps" class="an-grille-corps" role="tabpanel" aria-labelledby="an-grille-titre">
        <div id="an-plan" class="an-plan"></div>
        <ul id="an-resultats" class="an-resultats" role="listbox" aria-label="Résultats" hidden></ul>
        <div id="an-ailleurs" class="an-ailleurs"></div>
      </div>
      <!-- Ce qui est posé (commit 3) : sur les mots désignés, sinon sur la zone ; « Relevés : ▾ »
           règle de quelles grilles. -->
      <!-- Ce qui est posé et la boîte du guide partagent une hauteur fixe : repliée, la boîte
           laisse sa place à la liste (commit 7). -->
      <div class="an-bas">
      <section id="an-poses" class="an-poses" aria-labelledby="an-poses-titre">
        <div class="an-poses-tete">
          <h3 class="an-sous-titre" id="an-poses-titre">—</h3>
          <button id="an-releves-btn" class="ghost small an-releves-btn" type="button"
                  aria-expanded="false" aria-controls="an-releves-pop"
                  title="Les grilles dont les relevés s'affichent ici et sous les mots">Relevés ▾</button>
        </div>
        <div id="an-releves-pop" class="an-releves-pop" role="group"
             aria-label="Grilles dont les relevés s'affichent" hidden></div>
        <ul id="an-poses-liste" class="an-poses-liste"></ul>
      </section>
      <div id="an-guide" class="an-guide" aria-live="polite">
        <div id="an-guide-contenu" class="an-guide-contenu"></div>
        <div class="an-guide-pied">
          <button id="an-guide-replier" class="ghost small" type="button" aria-expanded="true"
                  aria-controls="an-guide-contenu">Guide ▾</button>
          <span class="nav-spacer"></span>
          <button id="an-guide-complet" class="ghost small" type="button">Guide complet ▸</button>
        </div>
      </div>
      </div>
    </aside>
    <div id="an-barre-poser" class="an-barre-poser">
      <span id="an-barre-sel" class="small an-barre-sel"></span>
      <button id="an-poser" class="primary" type="button" aria-controls="an-grille"
              aria-expanded="false">Poser… ▴</button>
    </div>
  </main>
  <!-- Ce qu'on pose, retire ou refuse, dit au lecteur d'écran. -->
  <p id="an-annonce" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Le guide complet, PRODUIT depuis la grille (modale `BDDialog`). -->
  <div id="an-guide-modal" hidden>
    <div class="modal-box an-guide-box">
      <h3 id="an-guide-titre">Guide</h3>
      <div id="an-guide-corps" class="an-guide-corps" tabindex="0" role="region"
           aria-labelledby="an-guide-titre"></div>
      <div class="modal-actions">
        <button id="an-guide-fermer" class="ghost small" type="button">Fermer</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/lib/common.js"></script>
<script src="/static/lib/nav.js"></script>
<script src="/static/lib/projet.js"></script>
<script src="/static/lib/bibliotheque.js"></script><!-- l'ordre des collections, celui de l'Atelier -->
<script src="/static/lib/atelier.js"></script><!-- le filtre de collection, partagé avec l'Atelier -->
<script src="/static/lib/conflit.js"></script><!-- les mots du bandeau de CONC-3 -->
<script src="/static/lib/propositions.js"></script><!-- les homonymes du champ « personnage » -->
<script src="/static/lib/champ-personnage.js"></script><!-- le locuteur, commun avec l'Atelier -->
<script src="/static/lib/annulation.js"></script><!-- Ctrl+Z, commun avec l'Atelier -->
<script src="/static/lib/signal-planche.js"></script><!-- « ⟳ Actualiser », commun avec l'Atelier -->
<script src="/static/lib/annotation.js"></script>
<script src="/static/lib/dialog.js"></script>
<script src="/static/lib/membres-projet.js"></script>
<script src="/static/lib/bac-a-sable.js"></script>
<script src="/static/bac-a-sable.js"></script><!-- COL-4 : « Mon bac à sable » et sa ligne, sur les six surfaces -->
<script src="/static/annotation.js"></script>
</body>
</html>
