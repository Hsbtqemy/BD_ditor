<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BD Annotator — Bibliothèque</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="corpus-app">

  <!-- ───────────── Bande 1 — Navigation du site (identique partout) ───────────── -->
  <div id="site-nav">
    <span class="brand">BD&nbsp;Annotator</span>
    <nav class="surf-nav"></nav><!-- liens injectés par theme.js (source unique) -->
    <span class="nav-spacer"></span>
    <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
    <button class="ghost btn-theme" title="Changer de thème">🌙</button>
  </div>

  <!-- ───────────── Bande 2 — Outils de la page ───────────── -->
  <header id="header">
    <div id="corpus-stats" class="corpus-stats"></div>
  </header>

  <main id="corpus-body">

    <!-- Barre d'actions + traitement par lot -->
    <div class="corpus-toolbar">
      <button id="btn-new" class="primary">+ Nouvel album</button>
      <div class="batch">
        <span class="muted small">Lot sur la sélection :</span>
        <label class="pass"><input type="checkbox" id="pass-segmenter"> Segmenter</label>
        <label class="pass"><input type="checkbox" id="pass-bulles"> Bulles</label>
        <label class="pass"><input type="checkbox" id="pass-ocr"> OCR</label>
        <button id="btn-run" class="primary" disabled>▶ Lancer</button>
        <span id="sel-info" class="muted small"></span>
      </div>
    </div>

    <!-- Jobs en cours / récents -->
    <div id="jobs"></div>

    <!-- Synthèse d'avancement du corpus -->
    <section id="corpus-synthese" class="corpus-synthese" hidden></section>

    <!-- Table des albums -->
    <table class="corpus-table">
      <thead><tr>
        <th class="c-chk" aria-label="Sélection"></th><th>Titre</th><th>Série</th><th>Auteur</th>
        <th class="c-num">Année</th><th class="c-num">Planches</th>
        <th class="c-num">Régions</th><th class="c-num">Transcrites</th>
        <th class="c-num">Validées</th><th aria-label="Actions"></th>
      </tr></thead>
      <tbody id="albums-body"></tbody>
    </table>

    <!-- Détail de l'album ouvert (planches + métadonnées) -->
    <section id="album-detail" hidden></section>
  </main>

  <!-- Modale création / édition d'album -->
  <div id="album-modal" hidden>
    <div class="modal-box">
      <h3 id="modal-title">Nouvel album</h3>
      <label>Titre <input id="m-titre" autocomplete="off"></label>
      <div class="modal-grid">
        <label>Série <input id="m-serie" autocomplete="off"></label>
        <label>Auteur <input id="m-auteur" autocomplete="off"></label>
        <label>Année <input id="m-annee" type="number" autocomplete="off"></label>
        <label>Éditeur <input id="m-editeur" autocomplete="off"></label>
      </div>
      <label>Description <textarea id="m-desc" rows="3"></textarea></label>
      <div class="modal-actions">
        <button id="m-save" class="primary">Enregistrer</button>
        <button id="m-cancel" class="ghost small">Annuler</button>
        <span id="m-msg" class="muted small"></span>
      </div>
    </div>
  </div>
</div>
<script src="/static/lib/common.js"></script>
<script src="/static/lib/nav.js"></script>
<script src="/static/lib/dialog.js"></script>
<script src="/static/corpus.js"></script>
</body>
</html>
