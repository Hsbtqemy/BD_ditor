<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BéDéditeur — Exploration</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="explo-app">

  <!-- ───────────── Bande 1 — Navigation du site (identique partout) ───────────── -->
  <div id="site-nav">
    <span class="brand">BéDéditeur</span>
    <nav class="surf-nav"></nav><!-- liens injectés par theme.js (source unique) -->
    <span class="nav-spacer"></span>
    <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
    <button class="ghost btn-theme" title="Changer de thème">🌙</button>
  </div>

  <!-- ───────────── Bande 2 — Outils de la page ───────────── -->
  <header id="header">
    <div id="corpus-stats" class="corpus-stats"></div>
  </header>

  <!-- ───────────────── Corps ───────────────── -->
  <main id="explo-body">

    <div class="explo-top">
      <label class="muted small">Distribuer par
        <select id="f-champ">
          <option value="lemme">lemme</option>
          <option value="pos">catégorie (POS)</option>
          <option value="morph">morphologie</option>
        </select>
      </label>
      <label class="muted small"><input type="checkbox" id="f-compare"> ⇄ Comparer deux sous-corpus</label>
      <label class="muted small" title="Inclure les tags posés sur la case parente (sinon, seul le tag propre à la région compte)"><input type="checkbox" id="f-tagscope" checked> tag hérité de la case</label>
      <span class="nav-spacer"></span>
      <button id="btn-lexique" class="ghost small" type="button"
              title="Documenter le vocabulaire : définitions, notes de portée, état (lexique situé SKOS)">📖 Lexique</button>
    </div>

    <div class="explo-grid">
      <div class="subcorpus" id="sub-a">
        <div class="sub-title muted small" hidden>Sous-corpus A</div>
        <div class="explo-controls">
          <select id="f-album" aria-label="Filtrer par album"><option value="">Tous les albums</option></select>
          <select id="f-type" aria-label="Filtrer par type de région">
            <option value="">Tous les types</option>
            <option value="bulle">bulle</option><option value="cartouche">cartouche</option>
            <option value="texte">texte</option><option value="case">case</option>
            <option value="personnage">personnage</option>
          </select>
          <select id="f-pos" aria-label="Filtrer par catégorie grammaticale (POS)"><option value="">POS (toutes)</option></select>
          <input type="text" id="f-morph" autocomplete="off"
                 aria-label="Filtrer par trait morphologique" placeholder="filtre morpho (ex. Tense=Past)">
          <select id="f-prov" aria-label="Filtrer par provenance de l'étiquetage">
            <option value="">Provenance : toutes</option>
            <option value="auto">auto</option><option value="corrige">corrigé</option><option value="valide">validé</option>
          </select>
          <select id="f-tags" aria-label="Filtrer par tag"><option value="">Tag : tous</option></select>
          <select id="f-personnage" aria-label="Filtrer par locuteur"><option value="">Locuteur : tous</option></select>
          <div id="f-attr-chips" class="attr-chips" role="group"
               aria-label="Filtrer par attribut — profil du locuteur ou situation de scène (un clic = un critère de plus)"></div>
        </div>
      </div>

      <div class="subcorpus" id="sub-b" hidden>
        <div class="sub-title muted small">Sous-corpus B</div>
        <div class="explo-controls">
          <select id="b-album" aria-label="Sous-corpus B — filtrer par album"><option value="">Tous les albums</option></select>
          <select id="b-type" aria-label="Sous-corpus B — filtrer par type de région">
            <option value="">Tous les types</option>
            <option value="bulle">bulle</option><option value="cartouche">cartouche</option>
            <option value="texte">texte</option><option value="case">case</option>
            <option value="personnage">personnage</option>
          </select>
          <select id="b-pos" aria-label="Sous-corpus B — filtrer par catégorie grammaticale (POS)"><option value="">POS (toutes)</option></select>
          <input type="text" id="b-morph" autocomplete="off"
                 aria-label="Sous-corpus B — filtrer par trait morphologique" placeholder="filtre morpho">
          <select id="b-prov" aria-label="Sous-corpus B — filtrer par provenance de l'étiquetage">
            <option value="">Provenance : toutes</option>
            <option value="auto">auto</option><option value="corrige">corrigé</option><option value="valide">validé</option>
          </select>
          <select id="b-tags" aria-label="Sous-corpus B — filtrer par tag"><option value="">Tag : tous</option></select>
          <select id="b-personnage" aria-label="Sous-corpus B — filtrer par locuteur"><option value="">Locuteur : tous</option></select>
          <div id="b-attr-chips" class="attr-chips" role="group"
               aria-label="Sous-corpus B — filtrer par attribut (profil du locuteur ou situation de scène)"></div>
        </div>
      </div>
    </div>

    <div id="dist-info" class="muted small" role="status" aria-live="polite"></div>
    <div id="dist" class="dist"></div>
    <div id="comparaison" class="comparaison" hidden></div>
  </main>

  <!-- ───────── Lexique situé (A4) — documentation SKOS du vocabulaire (modale) ───────── -->
  <div id="lexique-modal" hidden>
    <div class="modal-box lexique-box">
      <h3 id="lexique-title">Lexique situé</h3>
      <p class="muted small">Documenter le vocabulaire du corpus : <b>définition</b> (sens),
        <b>note de portée</b> (cadre d'emploi ici), <b>état</b> (provisoire → défini) et
        <b>portée</b> (global ou propre à une collection). Réemployable en SKOS à l'export.</p>
      <div id="lex-resume" class="muted small" role="status" aria-live="polite"></div>
      <div id="lex-body"></div>
      <div class="modal-actions">
        <label class="lex-import-portee small">Importer dans
          <select id="lex-import-portee"></select>
        </label>
        <button id="lex-import" class="ghost small" type="button">Importer un tableur…</button>
        <input id="lex-import-file" type="file" accept=".csv,text/csv" hidden>
        <button id="lex-close" class="ghost small" type="button">Fermer</button>
      </div>
    </div>
  </div>
</div>
<script src="/static/lib/common.js"></script>
<script src="/static/lib/nav.js"></script>
<script src="/static/lib/dialog.js"></script>
<script src="/static/exploration.js"></script>
</body>
</html>
