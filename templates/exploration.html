<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BD Annotator — Exploration</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="explo-app">

  <!-- ───────────────── Header ───────────────── -->
  <header id="header">
    <div class="brand">BD&nbsp;Annotator <span class="muted">· Exploration</span></div>
    <div id="corpus-stats" class="corpus-stats"></div>
    <div class="header-actions">
      <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
      <button class="ghost btn-theme" title="Changer de thème">🌙</button>
      <a href="/recherche" class="ghost" title="Recherche">🔍 Recherche</a>
      <a href="/corpus" class="ghost" title="Gérer le corpus">📚 Bibliothèque</a>
      <a href="/" class="ghost" title="Visionneuse / annotation">← Visionneuse</a>
    </div>
  </header>

  <!-- ───────────────── Corps ───────────────── -->
  <main id="explo-body">

    <div class="explo-top">
      <label class="muted small">Distribuer par
        <select id="f-champ">
          <option value="lemme">lemme</option>
          <option value="pos">catégorie (POS)</option>
          <option value="morph">morphologie</option>
        </select>
      </label>
      <label class="muted small"><input type="checkbox" id="f-compare"> ⇄ Comparer deux sous-corpus</label>
    </div>

    <div class="explo-grid">
      <div class="subcorpus" id="sub-a">
        <div class="sub-title muted small" hidden>Sous-corpus A</div>
        <div class="explo-controls">
          <select id="f-album"><option value="">Tous les albums</option></select>
          <select id="f-type">
            <option value="">Tous les types</option>
            <option value="bulle">bulle</option><option value="cartouche">cartouche</option>
            <option value="texte">texte</option><option value="case">case</option>
            <option value="personnage">personnage</option>
          </select>
          <select id="f-pos"><option value="">POS (toutes)</option></select>
          <input type="text" id="f-morph" autocomplete="off" placeholder="filtre morpho (ex. Tense=Past)">
          <select id="f-prov">
            <option value="">Provenance : toutes</option>
            <option value="auto">auto</option><option value="corrige">corrigé</option><option value="valide">validé</option>
          </select>
        </div>
      </div>

      <div class="subcorpus" id="sub-b" hidden>
        <div class="sub-title muted small">Sous-corpus B</div>
        <div class="explo-controls">
          <select id="b-album"><option value="">Tous les albums</option></select>
          <select id="b-type">
            <option value="">Tous les types</option>
            <option value="bulle">bulle</option><option value="cartouche">cartouche</option>
            <option value="texte">texte</option><option value="case">case</option>
            <option value="personnage">personnage</option>
          </select>
          <select id="b-pos"><option value="">POS (toutes)</option></select>
          <input type="text" id="b-morph" autocomplete="off" placeholder="filtre morpho">
          <select id="b-prov">
            <option value="">Provenance : toutes</option>
            <option value="auto">auto</option><option value="corrige">corrigé</option><option value="valide">validé</option>
          </select>
        </div>
      </div>
    </div>

    <div id="dist-info" class="muted small"></div>
    <div id="dist" class="dist"></div>
    <div id="comparaison" class="comparaison" hidden></div>
  </main>
</div>
<script src="/static/lib/nav.js"></script>
<script src="/static/exploration.js"></script>
</body>
</html>
