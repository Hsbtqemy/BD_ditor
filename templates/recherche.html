<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BD Annotator — Recherche</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script><!-- thème appliqué avant rendu (no-FOUC) -->
</head>
<body>
<div id="search-app">

  <!-- ───────────── Bande 1 — Navigation du site (identique partout) ───────────── -->
  <div id="site-nav">
    <span class="brand">BD&nbsp;Annotator</span>
    <nav class="surf-nav"></nav><!-- liens injectés par theme.js (source unique) -->
    <span class="nav-spacer"></span>
    <a id="back-link" class="ghost back-link" hidden title="Revenir d'où l'on vient">← Retour</a>
    <button class="ghost btn-theme" title="Changer de thème">🌙</button>
  </div>

  <!-- ───────────── Bande 2 — Outils de la page ───────────── -->
  <header id="header">
    <div id="corpus-stats" class="corpus-stats"></div>
  </header>

  <!-- ───────────────── Corps ───────────────── -->
  <main id="search-body">

    <div class="search-bar">
      <input type="search" id="q" autocomplete="off"
             aria-label="Rechercher dans les dialogues, notes et tags"
             placeholder="Rechercher dans les dialogues, notes, tags…">
      <select id="f-album" aria-label="Filtrer par album"><option value="">Tous les albums</option></select>
      <select id="f-type" aria-label="Filtrer par type de région">
        <option value="">Tous les types</option>
        <option value="bulle">bulle</option>
        <option value="cartouche">cartouche</option>
        <option value="texte">texte</option>
        <option value="case">case</option>
        <option value="personnage">personnage</option>
      </select>
    </div>

    <details id="gram-facets" class="gram-facets">
      <summary class="muted small">Facettes grammaticales</summary>
      <div class="facet-row">
        <select id="f-pos" title="Catégorie grammaticale (UPOS)"
                aria-label="Filtrer par catégorie grammaticale (POS)"><option value="">POS (toutes)</option></select>
        <input type="text" id="f-lemme" autocomplete="off"
               aria-label="Filtrer par lemme exact" placeholder="lemme exact (ex. pouvoir)">
        <input type="text" id="f-morph" autocomplete="off"
               aria-label="Filtrer par trait morphologique" placeholder="trait morpho (ex. Tense=Past)">
        <select id="f-prov" title="Provenance de l'étiquetage"
                aria-label="Filtrer par provenance de l'étiquetage">
          <option value="">Provenance : toutes</option>
          <option value="auto">auto</option>
          <option value="corrige">corrigé</option>
          <option value="valide">validé</option>
        </select>
      </div>
    </details>

    <div id="active-tags" class="active-tags"></div>
    <details id="tag-cloud-wrap" open>
      <summary class="muted small">Nuage de tags (cliquer pour filtrer)</summary>
      <div id="tag-cloud" class="tag-cloud"></div>
    </details>

    <div class="results-head">
      <div id="result-count" class="result-count muted" role="status" aria-live="polite"></div>
      <button id="btn-export" class="ghost small" disabled
              title="Exporter le jeu de résultats trouvé (CSV)">⤓ Export CSV</button>
    </div>
    <div id="results-pane">
      <div id="results" class="results"></div>
      <aside id="preview" class="preview" hidden>
        <div class="preview-head">
          <span id="preview-title" class="preview-title"></span>
          <a id="preview-edit" class="ghost small" title="Ouvrir dans la visionneuse pour éditer">✏️ Visionneuse</a>
          <button id="preview-close" class="ghost small" title="Fermer l'aperçu">✕</button>
        </div>
        <div id="preview-stage" class="preview-stage">
          <img id="preview-img" alt="" draggable="false">
          <svg id="preview-overlay" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div id="preview-text" class="preview-text"></div>
        <div id="preview-meta" class="muted small"></div>
      </aside>
    </div>
  </main>
</div>
<script src="/static/lib/nav.js"></script>
<script src="/static/recherche.js"></script>
</body>
</html>
